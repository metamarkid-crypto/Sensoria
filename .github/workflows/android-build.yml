name: Android Build 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

# GITHUB_TOKEN needs actions:write to DELETE old artifacts in the purge step.
permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: true

    steps:
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # keep android SDK, we need it
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔐 Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FISH_AUDIO_API_KEY=${{ secrets.EXPO_PUBLIC_FISH_AUDIO_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_VOICE_GIRL=${{ secrets.EXPO_PUBLIC_VOICE_GIRL }}" >> .env
          echo "EXPO_PUBLIC_VOICE_GIRL_2=${{ secrets.EXPO_PUBLIC_VOICE_GIRL_2 }}" >> .env
          echo "EXPO_PUBLIC_VOICE_BOY=${{ secrets.EXPO_PUBLIC_VOICE_BOY }}" >> .env
          echo "EXPO_PUBLIC_VOICE_BOY_2=${{ secrets.EXPO_PUBLIC_VOICE_BOY_2 }}" >> .env
          echo "EXPO_PUBLIC_VOICE_DAD=${{ secrets.EXPO_PUBLIC_VOICE_DAD }}" >> .env
          echo "EXPO_PUBLIC_VOICE_MOM=${{ secrets.EXPO_PUBLIC_VOICE_MOM }}" >> .env
          # QRIS scanner-filter secret (hmac.ts) — SAME value as QRIS_API_SECRET
          # in qris-api/.env.production. Missing it does NOT crash the app
          # (hmac.ts throws lazily at payment time with QRIS_API_SECRET_MISSING),
          # but without it the paywall can never open a checkout.
          echo "EXPO_PUBLIC_QRIS_API_SECRET=${{ secrets.EXPO_PUBLIC_QRIS_API_SECRET }}" >> .env

      - name: 🏗️ Run Expo Prebuild (Generate Native Code)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ── STORAGE GUARD ─────────────────────────────────────────────────────
      # The free plan gives only 500 MB of Actions storage. A failed run never
      # reached the purge step before, so its APK (100-200 MB) stayed forever
      # and the quota filled up ("storage full" on the next build). This step
      # now:
      #   • deletes EVERY artifact — this repo produces only the APK, so a
      #     blanket purge is safe and clears strays from failed/partial runs;
      #   • always runs — even when the build itself fails, old junk is still
      #     removed so the quota never wedges;
      #   • is failure-tolerant — one bad delete cannot abort the workflow.
      - name: 🧽 Purge ALL old artifacts (keep only the one uploaded below)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          page=1
          while : ; do
            RESP=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100&page=$page") || break
            IDS=$(echo "$RESP" | jq -r '.artifacts[]?.id // empty')
            [ -z "$IDS" ] && break
            for id in $IDS; do
              echo "Deleting old artifact $id"
              # Delete with retry; never let a single failure abort the purge.
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$id" > /dev/null || true
            done
            page=$((page + 1))
          done
          echo "Purge done. Free plan Actions storage is 500 MB and every APK is
          100-200 MB — wiping all old artifacts on EVERY run (success or not)
          keeps the quota free for the newest build."

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sensoria-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          # Backstop: even if every future purge were skipped, artifacts now
          # expire on their own instead of filling the quota forever.
          retention-days: 3
