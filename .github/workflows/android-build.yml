name: Android Build 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

# contents:write → publish the APK as a GitHub RELEASE (gh release create).
# Releases do NOT count against the 500 MB Actions storage quota — unlike
# artifacts, which kept wedging the pipeline ("Artifact storage quota has
# been hit") even after old runs were deleted, because ACTIONS CACHES also
# fill the same quota and survive artifact/run deletion. Strategy:
#   • no artifacts at all → the APK ships as a Release asset (free storage);
#   • no actions/setup-node cache → caches were the invisible quota eater;
#   • rotate old releases → only the 5 newest apk-v* builds remain.
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: true

    steps:
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # keep android SDK, we need it
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — Node 20 reached EOL (April 2026), which is why the
          # runner printed the "Node 20 is being deprecated" banner. Node 22
          # is fully supported by the Expo 57 / RN 0.86 toolchain.
          node-version: 22
          # Deliberately NO `cache: 'npm'`: caches share the 500 MB Actions
          # storage quota with artifacts and are NOT deleted when runs or
          # artifacts are — they silently filled the quota. A cold npm ci
          # costs a couple of minutes; a pipeline that never wedges on
          # storage is worth it.

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔐 Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FISH_AUDIO_API_KEY=${{ secrets.EXPO_PUBLIC_FISH_AUDIO_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_VOICE_GIRL=${{ secrets.EXPO_PUBLIC_VOICE_GIRL }}" >> .env
          echo "EXPO_PUBLIC_VOICE_GIRL_2=${{ secrets.EXPO_PUBLIC_VOICE_GIRL_2 }}" >> .env
          echo "EXPO_PUBLIC_VOICE_BOY=${{ secrets.EXPO_PUBLIC_VOICE_BOY }}" >> .env
          echo "EXPO_PUBLIC_VOICE_BOY_2=${{ secrets.EXPO_PUBLIC_VOICE_BOY_2 }}" >> .env
          echo "EXPO_PUBLIC_VOICE_DAD=${{ secrets.EXPO_PUBLIC_VOICE_DAD }}" >> .env
          echo "EXPO_PUBLIC_VOICE_MOM=${{ secrets.EXPO_PUBLIC_VOICE_MOM }}" >> .env
          # QRIS scanner-filter secret (hmac.ts) — SAME value as QRIS_API_SECRET
          # in qris-api/.env.production. Missing it does NOT crash the app
          # (hmac.ts throws lazily at payment time with QRIS_API_SECRET_MISSING),
          # but without it the paywall can never open a checkout.
          echo "EXPO_PUBLIC_QRIS_API_SECRET=${{ secrets.EXPO_PUBLIC_QRIS_API_SECRET }}" >> .env

      # ── FCM untuk PUSH (app ditutup total) ────────────────────────────────
      # Tanpa google-services.json, getExpoPushTokenAsync() gagal dan app
      # hanya punya notifikasi Realtime (mati saat app dibunuh). File ini
      # BUKAN rahasia server, tapi tetap disimpan sebagai secret supaya repo
      # tidak menyimpan konfigurasi Firebase per project.
      # Expo prebuild menyalin ./google-services.json → android/app/.
      - name: 🔔 Pasang google-services.json (FCM)
        # WAJIB lewat env, JANGAN `printf '%s' "${{ secrets.X }}"`.
        # Kutip ganda di dalam JSON menutup string shell → semua '"' hilang dan
        # file jadi `{ project_info: { ... } }` yang bukan JSON. Itu persis yang
        # menggagalkan build #76 & #77 walau secret-nya benar.
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            # Dulu `exit 0`: build tetap HIJAU dan APK tetap terbit, tapi tanpa
            # google_app_id di resources → getExpoPushTokenAsync() gagal di HP,
            # token tidak pernah masuk device_push_tokens, dan push mati total.
            # Kegagalan senyap itu sudah terjadi (APK r75 terbit tanpa FCM).
            echo "::error::GOOGLE_SERVICES_JSON kosong — APK ini tidak akan bisa menerima push. Isi secret-nya (Settings → Secrets → Actions) dengan isi google-services.json."
            exit 1
          fi
          printf '%s' "$GS_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" \
            || { echo "::error::GOOGLE_SERVICES_JSON bukan JSON valid"; exit 1; }

      - name: 🏗️ Run Expo Prebuild (Generate Native Code)
        run: npx expo prebuild --platform android --clean

      # Prebuild bisa "sukses" tanpa menyalin FCM. Periksa hasilnya di native
      # project, bukan di niat: tanpa file + plugin gradle, FirebaseApp tidak
      # pernah terinisialisasi dan push mustahil walau secret sudah terisi.
      # (google_app_id sendiri baru dibuat plugin SAAT gradle build, di
      # build/generated — karena itu tidak bisa dicek di sini.)
      - name: ✅ Verifikasi FCM benar-benar masuk ke build native
        run: |
          test -f android/app/google-services.json || { echo "::error::prebuild tidak menyalin google-services.json ke android/app/"; exit 1; }
          grep -q 'com.google.gms.google-services' android/app/build.gradle \
            || { echo "::error::plugin google-services tidak diterapkan di android/app/build.gradle"; exit 1; }
          echo "✅ FCM terpasang: $(node -p "require('./android/app/google-services.json').project_info.project_id")"

      # ── SIGNATURE PARITY with the Play AAB pipeline ────────────────────────
      # When the 4 keystore secrets are set, the APK is signed with the SAME
      # release keystore as the Play AAB (android-aab.yml) — one signature
      # across every channel. When they are absent, the pipeline keeps the
      # legacy debug-signed fallback so this pipeline never breaks.
      # NOTE: users switching from an old DEBUG-signed APK to a RELEASE-signed
      # one must uninstall first (Android rejects signature mismatches).
      - name: 🔑 Sign release with production keystore (when secrets present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "⚠️ Secret keystore belum diset — APK tetap DEBUG-SIGNED (fallback lama)."
            echo "   Set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEYSTORE_ALIAS / ANDROID_KEY_PASSWORD"
            echo "   agar signature APK = signature Play AAB. Panduan: docs/PLAYSTORE_RELEASE_GUIDE.md → Keystore."
            exit 0
          fi
          bash scripts/setup-keystore.sh
          node scripts/patch-release-signing.js
          echo "✅ APK akan ditandatangani release keystore (signature = Play AAB)"

      - name: 🔨 Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # Bukti terakhir dan paling jujur: periksa APK yang benar-benar akan
      # diunduh pengguna. resources.arsc tanpa gcm_defaultSenderId = push mati
      # di perangkat, apa pun isi secret dan log build di atas.
      - name: 🔍 Pastikan APK hasil build memuat konfigurasi Firebase
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -p "$APK" resources.arsc | grep -a -q 'gcm_defaultSenderId' \
            || { echo "::error::APK tidak memuat gcm_defaultSenderId — push TIDAK akan jalan di perangkat."; exit 1; }
          echo "✅ APK memuat konfigurasi Firebase (gcm_defaultSenderId ada)"

      # ── PUBLISH (replaces artifact upload) ────────────────────────────────
      # Releases storage is unlimited for this purpose and does not touch the
      # Actions quota. Tag format apk-v<version>-r<run_number> keeps builds
      # sortable; --latest marks it as the release testers should download.
      - name: 🏷️ Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="apk-v${VERSION}-r${{ github.run_number }}"
          # Dynamic signature note: testers MUST uninstall an old DEBUG-signed
          # APK before installing a RELEASE-signed one (signature mismatch).
          if [ -f android/keystore.properties ]; then
            SIG_NOTE="✅ APK ini RELEASE-SIGNED — signature sama dengan build Play Store.\n⚠️ Jika sebelumnya memasang APK lama (debug-signed), UNINSTALL DULU sebelum install — Android menolak update lintas signature."
          else
            SIG_NOTE="ℹ️ APK ini masih DEBUG-SIGNED (keystore secrets belum diset di repo)."
          fi
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "Sensoria APK v${VERSION} (build #${{ github.run_number }})" \
            --latest \
            --notes "Automated release build from commit ${{ github.sha }}.

          $SIG_NOTE

          Cara install: unduh app-release.apk → izinkan 'Install unknown apps' → install.

          Dibangun dengan nilai EXPO_PUBLIC_* dari Actions secrets repo ini."

      # ── QUOTA RECLAIM ──────────────────────────────────────────────────────
      # Caches from the OLD workflow runs (actions/setup-node `cache: 'npm'`)
      # still occupy quota and would only age out after 7 unused days. Delete
      # them on every run — the workflow no longer CREATES caches, so this is
      # a one-way reclaim that immediately frees the 500 MB budget.
      - name: 🧹 Purge legacy Actions caches (reclaim storage quota)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --limit 100 2>/dev/null | awk '{print $1}' | while read -r id; do
            echo "Deleting cache $id"
            gh cache delete "$id" || true
          done || true
          echo "Cache purge done."

      # ── ROTATION ───────────────────────────────────────────────────────────
      # Keep the 5 newest apk-v* releases so testers always see the current
      # build at the top and old builds never accumulate. Non-apk releases
      # (if any) are never touched. Failure-tolerant: one bad delete cannot
      # fail the workflow.
      - name: 🧽 Rotate old APK releases (keep 5 newest)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 | awk '$1 ~ /^apk-v/ {print $1}' | tail -n +6 | while read -r tag; do
            echo "Deleting old APK release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          echo "Rotation done — the 5 newest APK builds are kept."
