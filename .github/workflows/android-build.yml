name: Android Build 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

# contents:write → publish the APK as a GitHub RELEASE (gh release create).
# Releases do NOT count against the 500 MB Actions storage quota — unlike
# artifacts, which kept wedging the pipeline ("Artifact storage quota has
# been hit") even after old runs were deleted, because ACTIONS CACHES also
# fill the same quota and survive artifact/run deletion. Strategy:
#   • no artifacts at all → the APK ships as a Release asset (free storage);
#   • no actions/setup-node cache → caches were the invisible quota eater;
#   • rotate old releases → only the 5 newest apk-v* builds remain.
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: true

    steps:
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # keep android SDK, we need it
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — Node 20 reached EOL (April 2026), which is why the
          # runner printed the "Node 20 is being deprecated" banner. Node 22
          # is fully supported by the Expo 57 / RN 0.86 toolchain.
          node-version: 22
          # Deliberately NO `cache: 'npm'`: caches share the 500 MB Actions
          # storage quota with artifacts and are NOT deleted when runs or
          # artifacts are — they silently filled the quota. A cold npm ci
          # costs a couple of minutes; a pipeline that never wedges on
          # storage is worth it.

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔐 Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FISH_AUDIO_API_KEY=${{ secrets.EXPO_PUBLIC_FISH_AUDIO_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_VOICE_GIRL=${{ secrets.EXPO_PUBLIC_VOICE_GIRL }}" >> .env
          echo "EXPO_PUBLIC_VOICE_GIRL_2=${{ secrets.EXPO_PUBLIC_VOICE_GIRL_2 }}" >> .env
          echo "EXPO_PUBLIC_VOICE_BOY=${{ secrets.EXPO_PUBLIC_VOICE_BOY }}" >> .env
          echo "EXPO_PUBLIC_VOICE_BOY_2=${{ secrets.EXPO_PUBLIC_VOICE_BOY_2 }}" >> .env
          echo "EXPO_PUBLIC_VOICE_DAD=${{ secrets.EXPO_PUBLIC_VOICE_DAD }}" >> .env
          echo "EXPO_PUBLIC_VOICE_MOM=${{ secrets.EXPO_PUBLIC_VOICE_MOM }}" >> .env
          # QRIS scanner-filter secret (hmac.ts) — SAME value as QRIS_API_SECRET
          # in qris-api/.env.production. Missing it does NOT crash the app
          # (hmac.ts throws lazily at payment time with QRIS_API_SECRET_MISSING),
          # but without it the paywall can never open a checkout.
          echo "EXPO_PUBLIC_QRIS_API_SECRET=${{ secrets.EXPO_PUBLIC_QRIS_API_SECRET }}" >> .env

      - name: 🏗️ Run Expo Prebuild (Generate Native Code)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ── PUBLISH (replaces artifact upload) ────────────────────────────────
      # Releases storage is unlimited for this purpose and does not touch the
      # Actions quota. Tag format apk-v<version>-r<run_number> keeps builds
      # sortable; --latest marks it as the release testers should download.
      - name: 🏷️ Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="apk-v${VERSION}-r${{ github.run_number }}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "Sensoria APK v${VERSION} (build #${{ github.run_number }})" \
            --latest \
            --notes "Automated release build from commit ${{ github.sha }}.

          Cara install: unduh app-release.apk → izinkan 'Install unknown apps' → install.

          Dibangun dengan nilai EXPO_PUBLIC_* dari Actions secrets repo ini."

      # ── QUOTA RECLAIM ──────────────────────────────────────────────────────
      # Caches from the OLD workflow runs (actions/setup-node `cache: 'npm'`)
      # still occupy quota and would only age out after 7 unused days. Delete
      # them on every run — the workflow no longer CREATES caches, so this is
      # a one-way reclaim that immediately frees the 500 MB budget.
      - name: 🧹 Purge legacy Actions caches (reclaim storage quota)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --limit 100 2>/dev/null | awk '{print $1}' | while read -r id; do
            echo "Deleting cache $id"
            gh cache delete "$id" || true
          done || true
          echo "Cache purge done."

      # ── ROTATION ───────────────────────────────────────────────────────────
      # Keep the 5 newest apk-v* releases so testers always see the current
      # build at the top and old builds never accumulate. Non-apk releases
      # (if any) are never touched. Failure-tolerant: one bad delete cannot
      # fail the workflow.
      - name: 🧽 Rotate old APK releases (keep 5 newest)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 | awk '$1 ~ /^apk-v/ {print $1}' | tail -n +6 | while read -r tag; do
            echo "Deleting old APK release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          echo "Rotation done — the 5 newest APK builds are kept."
