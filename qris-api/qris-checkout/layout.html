<!DOCTYPE html>
<!--
  layout.html — shared page shell for the browser checkout.

  Visual language matches the Sensoria mobile app (PaywallScreen):
  teal #00B5B8 accent, deep-navy #11427B headings, soft slate body text on a
  light slate canvas, 16px rounded cards with soft shadows, and the crown
  brand mark drawn as inline SVG. Zero external dependencies (system font
  stack + inline CSS) — must render on any browser the APK can open, even on
  flaky mobile data.

  Plain HTML template with {{escaped}} and {{{raw}}} placeholder tokens
  (rendered by src/templates.js). NOTE: the doctype MUST stay the first
  line — anything before it (even a comment) throws the browser into
  quirks mode.
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00B5B8">
<title>{{title}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #EAF6F8 0%, #F8FAFC 240px);
    color: #1E293B; min-height: 100vh;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 18px 56px; }

  /* ── brand header ─────────────────────────────────────────────── */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 13px; flex: none;
    background: linear-gradient(135deg, #00B5B8 0%, #0EA5B9 60%, #11427B 130%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(0, 181, 184, 0.35);
  }
  .brand-name { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; color: #11427B; }
  .brand-name span { color: #00B5B8; }

  /* ── cards ────────────────────────────────────────────────────── */
  .card {
    background: #FFF; border-radius: 16px; padding: 18px; margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.05);
    border: 1px solid #F1F5F9;
  }
  .sub { font-size: 13px; color: #64748B; margin-bottom: 20px; line-height: 1.55; }
  .plan-name { font-size: 15px; font-weight: 800; color: #1E293B; }
  .plan-desc { font-size: 12px; color: #94A3B8; margin-top: 3px; }
  .price { font-size: 18px; font-weight: 900; color: #11427B; }
  .permo { font-size: 11px; color: #94A3B8; }

  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px;
    font-size: 15px; font-weight: 800; color: #FFF; cursor: pointer;
    background: linear-gradient(135deg, #00B5B8 0%, #00A5AB 100%);
    box-shadow: 0 6px 14px rgba(0, 181, 184, 0.30);
    margin-top: 15px; transition: transform 0.06s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.985); opacity: 0.9; }

  .note { font-size: 11px; color: #94A3B8; text-align: center; line-height: 1.6; margin-top: 18px; padding: 0 16px; }
  .qr-img { width: 240px; height: 240px; display: block; margin: 12px auto; }
  .center { text-align: center; }
  .ok { color: #059669; font-weight: 900; font-size: 18px; }
  .ref { font-size: 11px; color: #94A3B8; margin-top: 6px; }
  .err {
    background: #FFF0F5; color: #BE185D; border-radius: 12px; padding: 12px;
    font-size: 13px; margin-bottom: 12px; text-align: center;
  }

  @media (max-width: 360px) {
    .wrap { padding: 22px 14px 48px; }
    .price { font-size: 17px; }
  }
</style>
</head>
<body><div class="wrap">
<div class="brand">
  <div class="brand-mark" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 16.5 3 9.5l5 3 4-6 4 6 5-3-2 7c-.3 1.1-1.2 1.5-2 1.5H7c-.8 0-1.7-.4-2-1.5Z" fill="#FFF"/>
      <circle cx="12" cy="13.5" r="1.6" fill="#00B5B8"/>
    </svg>
  </div>
  <div class="brand-name">Sensoria<span> Premium</span></div>
</div>
{{{body}}}
</div></body>
</html>
