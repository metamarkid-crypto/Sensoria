<!--
  plan-card.html — one plan card + its order button (GET /pay/:token/plan/:planId).
  Rendered once per active plan by src/routes/web.js.
-->
<div class="card plan">
  <div>
    <div class="plan-name">{{name}}</div>
    <div class="plan-desc">{{monthsLine}}{{descSuffix}}</div>
  </div>
  <div class="plan-price">
    <div class="price">{{price}}</div>
    <div class="permo">{{perMonth}}{{perMonthSuffix}}</div>
  </div>
</div>
<form method="get" action="{{action}}">
  <input type="hidden" name="provider" value="{{provider}}">
  <button class="btn" type="submit">{{buttonLabel}}</button>
</form>
